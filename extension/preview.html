<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local HTML preview</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <header>
    <strong id="filename" title="Source URL">Local HTML preview</strong>
    <a id="source" target="_blank" rel="noopener noreferrer">View on GitHub</a>
    <label id="scripts-label" title="Loads scripts and HTTPS assets from this HTML, including path-relative GitHub raw resources, allowing third-party code and network requests inside an isolated sandbox. Use at your own risk.">
      <input id="scripts" type="checkbox" aria-describedby="scripts-warning"> Allow active content
    </label>
    <span id="scripts-warning" class="visually-hidden">Loads scripts and HTTPS assets from this HTML, including path-relative GitHub raw resources, allowing third-party code and network requests inside an isolated sandbox. Use at your own risk.</span>
  </header>
  <iframe id="sandbox" src="sandbox.html" title="HTML preview"></iframe>
  <p id="error" role="alert" hidden></p>
  <script src="preview.js"></script>
</body>
</html>
